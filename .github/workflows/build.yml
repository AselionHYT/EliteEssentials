name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: dist
      - name: Check tag matches pluginVersion
        run: |
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pluginVersion ${version}" >&2
            exit 1
          fi
          ls dist/EliteEssentials-${version}.jar
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          server="$(sed -n 's/^serverVersion=//p' gradle.properties)"
          (cd dist && sha256sum "EliteEssentials-${version}.jar" > "EliteEssentials-${version}.jar.sha256")
          # A version with a -pre suffix (e.g. 2.0.11-aselion.1-pre0.7.1) is a pre-release and never "latest".
          prerelease=""
          case "${version}" in *-pre*) prerelease="--prerelease --latest=false" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            "dist/EliteEssentials-${version}.jar" "dist/EliteEssentials-${version}.jar.sha256" \
            --verify-tag ${prerelease} \
            --title "EliteEssentials ${version} (Aselion build for Hytale ${server})" \
            --notes "Built by GitHub Actions from ${GITHUB_SHA}. Changes: see CHANGELOG.md."
